<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="140" viewBox="0 0 600 140" role="img" aria-label="CYBER GLITCH" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CYBER GLITCH</title>
  <defs>
    <!-- ▼ 表示テキストはここ1か所を書き換えるだけでOK -->
    <text id="t" x="300" y="82" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="54" font-weight="700" letter-spacing="4">CYBER GLITCH</text>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>

    <linearGradient id="laser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9ffcff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#14052b"/>
      <stop offset="1" stop-color="#05010d"/>
    </radialGradient>

    <clipPath id="band1"><rect x="0" y="30" width="600" height="14"/></clipPath>
    <clipPath id="band2"><rect x="0" y="62" width="600" height="10"/></clipPath>
    <clipPath id="band3"><rect x="0" y="48" width="600" height="8"/></clipPath>
    <clipPath id="frame"><rect x="0" y="0" width="600" height="140" rx="10"/></clipPath>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .r  { fill:#ff1744; mix-blend-mode:screen; animation:rs 2.4s infinite step-end; }
    .b  { fill:#00e5ff; mix-blend-mode:screen; animation:bs 2.4s infinite step-end; }
    .m  { fill:#ffffff; animation:ms 2.4s infinite step-end; }
    .s1 { fill:#ffffff; animation:sl1 1.7s infinite step-end; }
    .s2 { fill:#ff1744; animation:sl2 2.1s infinite step-end; }
    .s3 { fill:#00e5ff; animation:sl3 1.3s infinite step-end; }
    .laser { animation:sweep 3.2s linear infinite; }
    .flash { animation:flash 2.4s infinite step-end; }
    .cur { animation:blink 1s infinite step-end; }

    @keyframes rs {
      0%{transform:translate(-3px,0)} 8%{transform:translate(6px,1px)} 10%{transform:translate(-7px,-1px)}
      30%{transform:translate(2px,0)} 52%{transform:translate(-5px,0)} 54%{transform:translate(8px,0)}
      70%{transform:translate(-2px,1px)} 90%{transform:translate(5px,0)} 100%{transform:translate(-3px,0)}
    }
    @keyframes bs {
      0%{transform:translate(3px,0)} 8%{transform:translate(-6px,-1px)} 10%{transform:translate(7px,1px)}
      30%{transform:translate(-2px,0)} 52%{transform:translate(5px,0)} 54%{transform:translate(-8px,0)}
      70%{transform:translate(2px,-1px)} 90%{transform:translate(-5px,0)} 100%{transform:translate(3px,0)}
    }
    @keyframes ms {
      0%{transform:translate(0,0)} 9%{transform:translate(-4px,0)} 11%{transform:translate(0,0)}
      53%{transform:translate(5px,0)} 55%{transform:translate(0,0)} 91%{transform:translate(-3px,0)} 93%{transform:translate(0,0)}
    }
    @keyframes sl1 {
      0%{opacity:0} 8%{opacity:1;transform:translate(-30px,0)} 12%{opacity:1;transform:translate(24px,0)}
      15%{opacity:0} 50%{opacity:1;transform:translate(40px,0)} 54%{opacity:0}
      80%{opacity:1;transform:translate(-18px,0)} 84%{opacity:0}
    }
    @keyframes sl2 {
      0%{opacity:0} 20%{opacity:1;transform:translate(26px,0)} 24%{opacity:1;transform:translate(-34px,0)}
      27%{opacity:0} 66%{opacity:1;transform:translate(-22px,0)} 70%{opacity:0}
    }
    @keyframes sl3 {
      0%{opacity:0} 35%{opacity:1;transform:translate(-44px,0)} 38%{opacity:1;transform:translate(14px,0)}
      41%{opacity:0} 74%{opacity:1;transform:translate(30px,0)} 77%{opacity:0}
    }
    @keyframes sweep {
      0%{transform:translateY(-40px)} 100%{transform:translateY(150px)}
    }
    @keyframes flash {
      0%{opacity:0} 9%{opacity:0.12} 10%{opacity:0} 53%{opacity:0.1} 54%{opacity:0}
    }
    @keyframes blink { 0%{opacity:1} 50%{opacity:0} }
  </style>

  <g clip-path="url(#frame)">
    <rect width="600" height="140" fill="url(#bg)"/>

    <!-- グリッド -->
    <g stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1">
      <path d="M0 35H600M0 70H600M0 105H600"/>
      <path d="M100 0V140M200 0V140M300 0V140M400 0V140M500 0V140"/>
    </g>

    <!-- RGBスプリット + メイン -->
    <use xlink:href="#t" href="#t" class="r"/>
    <use xlink:href="#t" href="#t" class="b"/>
    <use xlink:href="#t" href="#t" class="m"/>

    <!-- ジャキジャキ横ズレのスライス -->
    <g clip-path="url(#band1)"><use xlink:href="#t" href="#t" class="s1"/></g>
    <g clip-path="url(#band2)"><use xlink:href="#t" href="#t" class="s2"/></g>
    <g clip-path="url(#band3)"><use xlink:href="#t" href="#t" class="s3"/></g>

    <!-- サブテキスト -->
    <text x="300" y="116" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#00e5ff" fill-opacity="0.85" letter-spacing="3">&gt; SYSTEM ONLINE<tspan class="cur">_</tspan></text>

    <!-- 走査線（レーザー） -->
    <g class="laser">
      <rect x="0" y="0" width="600" height="30" fill="url(#laser)" opacity="0.35"/>
      <rect x="0" y="14" width="600" height="2" fill="#aefcff" filter="url(#glow)"/>
      <rect x="0" y="14.5" width="600" height="1" fill="#ffffff"/>
    </g>

    <!-- 固定の走査線テクスチャ -->
    <rect width="600" height="140" fill="url(#scan)"/>

    <!-- 瞬間フラッシュ -->
    <rect class="flash" width="600" height="140" fill="#ffffff"/>
  </g>

  <!-- 枠 -->
  <rect x="1.5" y="1.5" width="597" height="137" rx="10" fill="none" stroke="#ff1744" stroke-opacity="0.7" stroke-width="1.5"/>
  <g stroke="#00e5ff" stroke-width="3" fill="none">
    <path d="M12 30V12H30"/><path d="M570 12H588V30"/>
    <path d="M12 110V128H30"/><path d="M570 128H588V110"/>
  </g>
</svg>
